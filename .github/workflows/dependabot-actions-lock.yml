# This workflow is managed by gh actions-lock.

name: Dependabot Actions Lock

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions: {}

jobs:
  relock-actions:
    name: Regenerate actions-lock lockfile
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    concurrency:
      group: 'dependabot-actions-lock-${{ github.event.pull_request.number }}'
      cancel-in-progress: true

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Dependabot branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: true

      - name: Install actions-lock CLI
        run: gh extension install github/gh-actions-lock --pin v0.1.6

      - name: Regenerate actions-lock lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh actions-lock --no-interactive --no-onboard --rescan

      - name: Commit and push lockfile changes
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/

          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi

          git commit -m "chore: regenerate actions-lock lockfile"
          git push origin "HEAD:$HEAD_REF"
