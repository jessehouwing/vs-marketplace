# This workflow is managed by gh actions-lock.

name: Test GitHub Actions
run-name: Test GitHub Actions v${{ inputs.version || inputs.ref || github.ref_name || github.ref }} (${{ inputs.os || 'windows-latest' }}, ${{ inputs.auth-type || 'pat' }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test'
        required: false
        type: string
      version:
        description: 'Release version being tested'
        required: false
        type: string
      os:
        description: 'Runner OS for GitHub Action validation'
        required: false
        type: string
        default: windows-latest
      auth-type:
        description: 'Authentication mode to validate'
        required: false
        type: string
        default: pat

permissions: {}

env:
  PUBLISHER_ID: jessehouwing

jobs:
  test:
    name: Test (${{ inputs.auth-type }}, ${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    environment: publisher-jessehouwing

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Verify GitHub Action dist/ build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar --output "$RUNNER_TEMP/github-action-dist.tar" HEAD packages/github-action/dist
          gh attestation verify "$RUNNER_TEMP/github-action-dist.tar" --repo "$GITHUB_REPOSITORY"

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - id: azure-devops-token
        name: Get Azure DevOps bearer token
        if: ${{ inputs.auth-type == 'pat' }}
        shell: pwsh
        run: |
          $token = az account get-access-token `
            --resource 499b84ac-1321-427f-aa17-267ca6975798 `
            --query accessToken --output tsv
          Write-Host "::add-mask::$token"
          "token=$token" >> $env:GITHUB_OUTPUT

      - name: Publish VS extension
        uses: $/
        with:
          auth-type: ${{ inputs.auth-type }}
          token: ${{ inputs.auth-type == 'pat' && steps.azure-devops-token.outputs.token || '' }}
          vsix-file: tests/sample-extension/vs-marketplace-test-1.0.0.vsix
          manifest-file: tests/sample-extension/publish-manifest.json
          publisher-id: ${{ env.PUBLISHER_ID }}
