# Test Azure Pipelines
#
# Triggered by the release workflow to validate the vs-marketplace Azure
# Pipelines task against a minimal Visual Studio extension sample, using a
# static pre-built .vsix fixture. Tests the Publish operation for a single
# auth + OS scenario. The matrix fan-out lives in GitHub Actions so each
# scenario is visible directly in the Actions summary.
#
# Required service connections:
#   MarketplacePatConnection     - PAT service connection (VsMarketplacePublishing type)
#   MarketplaceAzureRmConnection - Azure RM (OIDC) service connection
#
# Required parameters per run:
#   vmImage        - Hosted agent image; must be Windows with VsixPublisher.exe (VS + VSSDK
#                    component) available, e.g. windows-latest, windows-2025-vs2026,
#                    windows-11-vs2026-arm. See https://github.com/actions/runner-images#available-images
#   connectionType - PAT | AzureRM

name: test-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: publisherId
    type: string
    default: jessehouwing
  - name: vmImage
    type: string
    default: windows-latest
  - name: connectionType
    type: string
    default: PAT
  - name: azureRmConnection
    type: string
    default: fdeb6c4d-4557-4355-a9f8-594ac4fb3db1
  - name: marketplaceServiceConnectionName
    type: string
    default: ecc95f54-6da9-45ee-9917-2d351728ee70

stages:
  - stage: Test
    displayName: Test Azure Pipelines

    jobs:
      - job: Test
        displayName: Test (${{ parameters.connectionType }}, ${{ parameters.vmImage }})
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - checkout: self

          # Acquire a short-lived marketplace bearer token (always, regardless of
          # connectionType) so the version-stamping step below can look up the
          # extension's currently published version via the Gallery REST API.
          - task: AzureCLI@2
            displayName: Get marketplace bearer token for version lookup
            inputs:
              azureSubscription: ${{ parameters.azureRmConnection }}
              allowNoSubscriptions: true
              scriptType: pscore
              useGlobalConfig: true
              scriptLocation: inlineScript
              inlineScript: |
                $token = az account get-access-token `
                  --resource 499b84ac-1321-427f-aa17-267ca6975798 `
                  --query accessToken --output tsv
                if (-not $token) {
                  throw 'Failed to acquire Azure DevOps bearer token'
                }
                Write-Host "##vso[task.setvariable variable=marketplaceAccessToken;issecret=true]$token"

          # For PAT matrix entries, acquire a short-lived marketplace token at
          # runtime from the OIDC-backed Azure RM connection so no PAT secret is
          # stored. Resolve the VsMarketplacePublishing service connection by name
          # or GUID, then overwrite its password auth parameter with the token.
          - task: AzureCLI@2
            displayName: Get Azure DevOps bearer token
            condition: and(succeeded(), eq('${{ parameters.connectionType }}', 'PAT'))
            env:
              MARKETPLACESERVICECONNECTIONNAME: ${{ parameters.marketplaceServiceConnectionName }}
            inputs:
              azureSubscription: ${{ parameters.azureRmConnection }}
              allowNoSubscriptions: true
              scriptType: pscore
              useGlobalConfig: true
              scriptLocation: inlineScript
              inlineScript: |
                $organizationUrl = $env:SYSTEM_COLLECTIONURI.TrimEnd('/')
                $projectName = $env:SYSTEM_TEAMPROJECT
                $connectionName = $env:MARKETPLACESERVICECONNECTIONNAME
                $endpointType = 'VsMarketplacePublishing'

                if (-not $connectionName) {
                  throw 'MARKETPLACESERVICECONNECTIONNAME is required'
                }

                $parsedGuid = [guid]::Empty
                if ([guid]::TryParse($connectionName, [ref]$parsedGuid)) {
                  $marketplaceServiceConnectionId = $parsedGuid.ToString()
                }
                else {
                  $escapedProject = [uri]::EscapeDataString($projectName)
                  $escapedName = [uri]::EscapeDataString($connectionName)
                  $escapedType = [uri]::EscapeDataString($endpointType)
                  $endpointUrl = "$organizationUrl/$escapedProject/_apis/serviceendpoint/endpoints?endpointNames=$escapedName&type=$escapedType&api-version=7.1"

                  $endpointResponse = az rest --method get --uri $endpointUrl --resource 499b84ac-1321-427f-aa17-267ca6975798
                  $endpointJson = $endpointResponse | ConvertFrom-Json
                  $matchingEndpoints = @(
                    $endpointJson.value | Where-Object {
                      $_.name -eq $connectionName -and $_.type -eq $endpointType
                    }
                  )

                  if ($matchingEndpoints.Count -ne 1) {
                    throw "Expected exactly one service connection named '$connectionName' with type '$endpointType' in project '$projectName', found $($matchingEndpoints.Count)"
                  }

                  $marketplaceServiceConnectionId = $matchingEndpoints[0].id
                }

                $token = az account get-access-token `
                  --resource 499b84ac-1321-427f-aa17-267ca6975798 `
                  --query accessToken --output tsv
                if (-not $token) {
                  throw 'Failed to acquire Azure DevOps bearer token'
                }

                Write-Host "##vso[task.setvariable variable=marketplaceServiceConnectionId]$marketplaceServiceConnectionId"
                Write-Host "Resolved marketplace service connection id: $marketplaceServiceConnectionId"
                Write-Host "##vso[task.setsecret]$token"
                Write-Host "##vso[task.setendpoint id=$marketplaceServiceConnectionId;field=authParameter;key=password]$token"

          # Publish the same fixture twice fails on the marketplace ("version already exists").
          # connectionType x vmImage matrix legs run concurrently, so each must publish to its
          # own private extension (rather than racing for the "next" version of a shared one);
          # look up the currently published version of that scenario's extension and stamp the
          # next one onto a copy of the fixture (and manifest).
          - task: PowerShell@2
            displayName: Stamp unique test .vsix version
            inputs:
              targetType: filePath
              filePath: Scripts/Stamp-TestVsix.ps1
              arguments: >-
                -SourcePath tests/sample-extension/vs-marketplace-test-1.0.0.vsix
                -OutputPath $(Agent.TempDirectory)/vs-marketplace-test-stamped.vsix
                -PublisherId ${{ parameters.publisherId }}
                -ExtensionId vs-marketplace-test-azdo-${{ lower(parameters.connectionType) }}-${{ lower(parameters.vmImage) }}
                -AccessToken $(marketplaceAccessToken)
                -ManifestPath tests/sample-extension/publish-manifest.json
                -ManifestOutputPath $(Agent.TempDirectory)/publish-manifest-stamped.json

          # --- Publish: push the pre-built .vsix fixture to the Visual Studio Marketplace ---
          - task: vs-marketplace@6
            displayName: Publish VS extension
            inputs:
              connectionType: ${{ parameters.connectionType }}
              connectionNamePAT: ${{ parameters.marketplaceServiceConnectionName }}
              connectionNameAzureRM: ${{ parameters.azureRmConnection }}
              vsixFile: $(Agent.TempDirectory)/vs-marketplace-test-stamped.vsix
              manifestFile: $(Agent.TempDirectory)/publish-manifest-stamped.json
              publisherId: ${{ parameters.publisherId }}
