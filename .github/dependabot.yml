# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      minor-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      ESLint:
        patterns:
          - eslint
          - '@typescript-eslint/*'
          - '@eslint/*'
          - typescript-eslint
      rollup:
        patterns:
          - '@rollup/*'
      minor-updates:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
    ignore:
      # Node 24 is the current LTS; @types/node is pinned to match.
      - dependency-name: '@types/node'
        versions: ['>=25']
      # TypeScript 7 (native/Go port) is not yet compatible with our ts-jest/ts-node toolchain.
      - dependency-name: 'typescript'
        versions: ['>=7']
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      minor-updates:
        update-types:
          - minor
          - patch
